services:
  - type: web
    name: gamified-todo-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false        # you paste this in the Render dashboard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false        # you paste this in the Render dashboard
      - key: FRONTEND_URL
        sync: false        # set to your Vercel URL after frontend deploy
